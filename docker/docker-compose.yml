version: '3.8'

services:
  gitlab-webhook:
    image: pg-llms-gitlab-webhook:latest
    container_name: pr-agent-gitlab-webhook
    ports:
      - "3000:3000"  # 映射端口到主机
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - pr-agent-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      # 可选：挂载日志目录
      - ./logs:/app/logs
      # 可选：挂载配置文件
      - ./config:/app/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gitlab-webhook.rule=PathPrefix(`/webhook`)"
      - "traefik.http.services.gitlab-webhook.loadbalancer.server.port=3000"

networks:
  pr-agent-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16 